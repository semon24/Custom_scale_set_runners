services:
  scale-set-runner-backend:
    image: registry.ft-soft.ru/devops/scale_set_runners:latest
    container_name: vneocheredi-runner-backend
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/scale-set-runners/secrets/vneocheredi/key.pem:/run/secrets/github-app-key.pem:ro
    environment:
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}  
    command: >
      --runner-image="registry.ft-soft.ru/devops/runner_vneocheredi_backend:latest"
      --url="https://github.com/VneOcheredi"
      --name="vneocheredi_runner"
      --labels="vneocheredi_runner_backend"
      --min-runners=1
      --max-runners=4
      --log-level=info
      --app-client-id=${GITHUB_APP_CLIENT_ID}
      --app-installation-id=${GITHUB_APP_INSTALLATION_ID}
      --app-private-key-file=/run/secrets/github-app-key.pem
